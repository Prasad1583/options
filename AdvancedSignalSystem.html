/* =========================
   UTILS
   ========================= */
const fmtTime = () => new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit'});
const sum = arr => arr.reduce((a,b)=>a+Number(b||0),0);
function ema(arr, len){ const k=2/(len+1); let prev=null; const out=[]; for(let i=0;i<arr.length;i++){ const v=Number(arr[i]); if(!isFinite(v)){ out.push(prev); continue; } prev=(prev==null)?v:(v*k+prev*(1-k)); out.push(prev); } return out; }
function pctSpread(bid, ask){ bid=Number(bid); ask=Number(ask); if(!ask||!bid||ask<=0) return null; return ((ask-bid)/ask)*100; }
function uniqSortedStrikes(rows){ return [...new Set(rows.map(r=>r.strike_price))].sort((a,b)=>a-b); }
function nearestATM(strikes, spot){ let best=strikes[0], bd=Math.abs(best-spot); for(const k of strikes){ const d=Math.abs(k-spot); if(d<bd){bd=d; best=k;} } return best; }
function chooseWindow(strikes, atm){
  const half = Math.floor(WINDOW_STRIKES/2);
  const pos = strikes.indexOf(atm);
  let start = pos===-1 ? Math.max(0, strikes.findIndex(k=>k>=atm)-half) : Math.max(0, pos-half);
  if (start + WINDOW_STRIKES > strikes.length) start = Math.max(0, strikes.length - WINDOW_STRIKES);
  return strikes.slice(start, start + WINDOW_STRIKES);
}
function topWalls(rows, side, n=2){
  const filtered = rows.filter(r=>r.option_type===side).map(r=>({k:r.strike_price, oi:Number(r.oi||0)}));
  filtered.sort((a,b)=>b.oi-a.oi); return filtered.slice(0,n);
}
function nearestCallWallAbove(rows, spot){
  const walls = topWalls(rows, 'CE', 4).map(w=>w.k).filter(k=>k>=spot).sort((a,b)=>a-b);
  return walls[0] ?? null;
}
function nearestPutWallBelow(rows, spot){
  const walls = topWalls(rows, 'PE', 4).map(w=>w.k).filter(k=>k<=spot).sort((a,b)=>b-a);
  return walls[0] ?? null;
}
function maxPain(strikes, rows){
  const by = new Map();
  rows.forEach(r=>by.set(`${r.option_type}-${r.strike_price}`, r));
  const payoffAt = (spot)=>{
    let total=0;
    for(const k of strikes){
      const ce=by.get(`CE-${k}`), pe=by.get(`PE-${k}`);
      total += (ce?.oi||0)*Math.max(0, spot-k);
      total += (pe?.oi||0)*Math.max(0, k-spot);
    }
    return total;
  };
  let bestK = strikes[0], bestPay = payoffAt(strikes[0]);
  for(const k of strikes){ const p=payoffAt(k); if(p<bestPay){bestPay=p; bestK=k;} }
  return bestK;
}

/* =========================
   SIGNAL ENGINE (patched volHeat typo)
   ========================= */
function signalFrom(ctx){
  let {
    spotSeries, spot, atm, vix,
    ceATM, peATM,
    ceRowsWin, peRowsWin,
    lastBias, biasStreak,
    _pcrOverride = null
  } = ctx;

  const ceOIw = sum(ceRowsWin.map(r=>r?.oi));
  const peOIw = sum(peRowsWin.map(r=>r?.oi));
  const pcrWraw  = ceOIw ? peOIw/ceOIw : null;
  const pcrW = (_pcrOverride ?? pcrWraw);

  const ceOIchp = Number(ceATM?.oichp ?? 0);
  const peOIchp = Number(peATM?.oichp ?? 0);
  const volCEw = sum(ceRowsWin.map(r=>r?.volume));
  const volPEw = sum(peRowsWin.map(r=>r?.volume));

  const s3 = ema(spotSeries,3), s8 = ema(spotSeries,8);
  const fast = s3.at(-1), slow = s8.at(-1);
  const trendUp = fast!=null && slow!=null && fast>slow;
  const trendDown = fast!=null && slow!=null && fast<slow;

  const liqSpreads=[];
  if (ceATM){ const v=pctSpread(ceATM.bid, ceATM.ask); if(v!=null) liqSpreads.push(v); }
  if (peATM){ const v=pctSpread(peATM.bid, peATM.ask); if(v!=null) liqSpreads.push(v); }
  const avgSpread = liqSpreads.length? liqSpreads.reduce((a,b)=>a+b,0)/liqSpreads.length : null;
  const liqOK = (avgSpread!=null && avgSpread <= SPREAD_MAX_PCT);

  let bull=0, bear=0;
  if (pcrW!=null){ if (pcrW>PCR_BULL) bull+=2; if (pcrW<PCR_BEAR) bear+=2; }
  if (peOIchp > ceOIchp + OICHP_DIFF) bull+=1; if (ceOIchp > peOIchp + OICHP_DIFF) bear+=1;
  if (volPEw > volCEw*VOL_RATIO) bull+=1; if (volCEw > volPEw*VOL_RATIO) bear+=1;
  if (trendUp) bull+=1; if (trendDown) bear+=1;

  const pcrHeat   = (pcrW==null) ? 0 : Math.min(1, Math.abs(pcrW - 1.0));
  const oichHeat  = Math.min(1, Math.max(0, (Math.abs(peOIchp - ceOIchp) - OICHP_DIFF/2) / (OICHP_DIFF)));
  // FIXED: previously used (volPEw + volPEw)
  const volHeat   = (volCEw+volPEw) ? Math.min(1, Math.abs(volPEw - volCEw) / (volCEw + volPEw)) : 0;
  const trendHeat = (trendUp || trendDown) ? 0.25 : 0;
  const liqHeat   = (avgSpread!=null && avgSpread <= SPREAD_MAX_PCT) ? 0.15 : 0;
  const HEAT = pcrHeat + oichHeat + volHeat + trendHeat + liqHeat;

  let side='NEUTRAL';
  if (HEAT >= MIN_HEAT) {
    if (bull >= bear+2) side='BULL';
    else if (bear >= bull+2) side='BEAR';
  }

  if (side===lastBias && side!=='NEUTRAL') biasStreak++;
  else if (side!=='NEUTRAL'){ lastBias=side; biasStreak=1; }
  else { lastBias='NEUTRAL'; biasStreak=0; }
  const confirmed = (biasStreak >= CONFIRM_TICKS);

  const reasons=[];
  if (pcrW!=null) reasons.push(`${PCR_LABEL} ${pcrW.toFixed(2)}`);
  reasons.push(`ΔOI% CE ${ceOIchp.toFixed(1)} / PE ${peOIchp.toFixed(1)}`);
  reasons.push(`Vol CE/PE ${(VOL_TO_LAKHS(volCEw)).toFixed(1)}L / ${(VOL_TO_LAKHS(volPEw)).toFixed(1)}L`);
  reasons.push(`Trend ${trendUp?'UP':(trendDown?'DOWN':'FLAT')}`);
  if (avgSpread!=null) reasons.push(`Spread≈${avgSpread.toFixed(2)}%`);
  if (vix!=null) reasons.push(`VIX ${vix.toFixed(2)}`);
  reasons.push(`Heat ${HEAT.toFixed(2)}`);

  const missing=[];
  if (!liqOK) missing.push('Tight spread');
  if (!confirmed && side!=='NEUTRAL') missing.push(`${(CONFIRM_TICKS-biasStreak+1)}× confirm`);
  if (side==='BULL' && !trendUp)  missing.push('Trend up');
  if (side==='BEAR' && !trendDown) missing.push('Trend down');

  return { side, reasons, missing, confirmed, pcrW, trendUp, trendDown, avgSpread, lastBias, biasStreak, HEAT };
}

    //    { label:'Cum ΔLTP CE (Pts)', borderColor:'green', backgroundColor:'green', tension:0.25, fill:false, data:this.cltpCE },
     //   { label:'Cum ΔLTP PE (Pts)', borderColor:'red', backgroundColor:'red', tension:0.25, fill:false, data:this.cltpPE }
     // ]},
    //  options: JSON.parse(JSON.stringify(common))
  //  });
   // this.cltpChart.options.scales.y.title.text = 'Cum ΔLTP (Pts)';
   // this.cltpChart.options.plugins.legend.display = true;

    // NEW: Premium & Volume Divergence chart (ATM)
    const divOpts = JSON.parse(JSON.stringify(common));
    divOpts.plugins.legend.display = true;
    divOpts.scales.y.title.text = 'Premium (Pts)';
    divOpts.scales.y2 = { position:'right', title:{display:true,text:'Vol Div (CE−PE, Lakhs)'}, grid:{drawOnChartArea:false} };
    this.divChart = new Chart(this.el('divChart'), {
      type:'line',
      data:{ labels:this.labels, datasets:[
        { label:'ATM CE Premium', borderColor:'#2563eb', backgroundColor:'#2563eb', tension:0.25, fill:false, yAxisID:'y', data:this.atmCePrem },
        { label:'ATM PE Premium', borderColor:'#ef4444', backgroundColor:'#ef4444', tension:0.25, fill:false, yAxisID:'y', data:this.atmPePrem },
        { label:'Volume Divergence (CE−PE)', type:'bar', backgroundColor:'#6b7280', borderWidth:0, yAxisID:'y2', data:this.volDiv }
      ]},
      options: divOpts
    });
  }

  datasetFor(side, strike, color, dashed=false){
    const key=`K${strike}`; if(!this.series[side][key]) this.series[side][key] = {LTP:[],OI:[],OICH:[],VOL:[]};
    const ref=this.series[side][key];
    return { label:`${this.label} ${side} ${strike}`, borderColor:color, backgroundColor:color+'33', tension:0.25, fill:false, borderDash:dashed?[6,4]:[], _ref:ref, data:ref.LTP };
  }
  datasetForPCR(strike, color){
    const key = `K${strike}`;
    if (!this.seriesPCR[key]) this.seriesPCR[key] = { PCR: [] };
    const ref = this.seriesPCR[key];
    return {
      label: `${this.label} K${strike}`,
      borderColor: color,
      backgroundColor: color + '33',
      tension: 0.25,
      fill: false,
      _ref: ref,
      data: ref.PCR
    };
  }

  rebuildDatasets(){
    const pcr = this.selectedKs.map((k,i)=>this.datasetForPCR(k, CE_COLORS[i%CE_COLORS.length]));
    const datasetsPCR = pcr.map(d => ({ ...d, data: d._ref.PCR }));

    const bullPts = this.markersEntry.filter(m=>m.side==='BULL').map(m=>({x:this.labels[m.i], y:m.pcr ?? 1}));
    const bearPts = this.markersEntry.filter(m=>m.side==='BEAR').map(m=>({x:this.labels[m.i], y:m.pcr ?? 1}));
    const exitPts = this.markersExit.map(m=>({x:this.labels[m.i], y:m.pcr ?? 1, r:m.reason}));

    const markerBull = {
      type:'scatter', label:'BULL entries', data:bullPts,
      pointBackgroundColor:'#10b981', pointBorderColor:'#065f46',
      pointRadius: MARKER_RADIUS, pointStyle:'triangle', borderWidth:0
    };
    const markerBear = {
      type:'scatter', label:'BEAR entries', data:bearPts,
      pointBackgroundColor:'#ef4444', pointBorderColor:'#7f1d1d',
      pointRadius: MARKER_RADIUS, pointStyle:'rectRot', borderWidth:0
    };
    const markerExit = {
      type:'scatter', label:'Exit', data:exitPts,
      parsing:false,
      pointBackgroundColor:'#f59e0b', pointBorderColor:'#7c2d12',
      pointRadius: MARKER_RADIUS, pointStyle:'crossRot', borderWidth:1,
      tooltip: { callbacks: { label: ctx => `Exit: ${ctx.raw.r || 'rule'}` } }
    };
    this.pcrChart.data.datasets = [...datasetsPCR, markerBull, markerBear, markerExit];

    const ce=this.selectedKs.map((k,i)=>this.datasetFor('CE',k,CE_COLORS[i%CE_COLORS.length],false));
    const pe=this.selectedKs.map((k,i)=>this.datasetFor('PE',k,PE_COLORS[i%PE_COLORS.length],true));
    //this.oiChart.data.datasets   = [...ce,...pe].map(d=>({...d,data:d._ref.OI}));
    this.oichChart.data.datasets = [...ce,...pe].map(d=>({...d,data:d._ref.OICH}));
    //this.volChart.data.datasets  = [...ce,...pe].map(d=>({...d,data:d._ref.VOL}));

    [this.pcrChart,this.oichChart,this.cvdChart,this.divChart].forEach(c=>c.update('none'));
    this.buildLegend();
  }

  buildLegend(){
    const el=this.el('legend'); const parts=[];
    this.selectedKs.forEach((k,i)=>{
      parts.push(`<span class="legend-chip"><span class="legend-dot" style="background:${CE_COLORS[i%CE_COLORS.length]}"></span>K ${k} (PCR)</span>`);
    });
    parts.push(`<span class="legend-chip"><span class="legend-dot" style="background:#10b981"></span>▲ Entry</span>`);
    parts.push(`<span class="legend-chip"><span class="legend-dot" style="background:#ef4444"></span>◆ Entry</span>`);
    parts.push(`<span class="legend-chip"><span class="legend-dot" style="background:#f59e0b"></span>✚ Exit</span>`);
    el.innerHTML=parts.join('');
  }

  buildUrl(){
    const p = new URLSearchParams({ symbol: this.symbol, strikecount: String(STRIKECOUNT_API) });
    if (this.currentExpiry) p.set('timestamp', String(this.currentExpiry));
    return `${API}?${p.toString()}`;
  }

  renderWalls(spot, rows){
    const cw = topWalls(rows, 'CE', 2);
    const pw = topWalls(rows, 'PE', 2);
    const fmtWL = (w)=> w.map(x=>`${x.k} (${OI_TO_LAKHS(x.oi).toFixed(1)}L, Δ ${x.k-spot>0?'+':''}${(x.k-spot).toFixed(0)})`).join(' • ');
    this.el('callWalls').textContent = cw.length? fmtWL(cw) : '--';
    this.el('putWalls').textContent  = pw.length? fmtWL(pw) : '--';
    const note = [];
    if (cw[0]) note.push(`Top call wall @ ${cw[0].k}, ${Math.round(cw[0].k-spot)} pts ${cw[0].k>spot?'above':'below'} spot`);
    if (pw[0]) note.push(`Top put wall @ ${pw[0].k}, ${Math.round(spot-pw[0].k)} pts ${pw[0].k<spot?'below':'above'} spot`);
    this.el('magnetNote').textContent = note.join(' • ') || '--';
  }

  renderKeyBar({ spot, atm, pcrW, pcr30, maxPainK, vix, nearBuildL, nearImbPct, liqScore, emaTag }){
    const m = (x)=>this.el(x);
    m('m_spot').textContent   = spot?.toFixed ? spot.toFixed(2) : '--';
    m('m_atm').textContent    = atm ?? '--';
    m('m_pcr10').textContent  = pcrW==null?'--':pcrW.toFixed(2);
    m('m_pcr30').textContent  = pcr30==null?'--':pcr30.toFixed(2);
    m('m_maxpain').textContent= maxPainK ?? '--';
    m('m_dmp').textContent    = (spot!=null && maxPainK!=null) ? Math.round(maxPainK-spot) : '--';
    m('m_oi_buildup').textContent = nearBuildL==null?'--':nearBuildL.toFixed(2)+'L';
    m('m_oich_imb').textContent   = nearImbPct==null?'--':nearImbPct.toFixed(1)+'%';
    m('m_liq').textContent    = liqScore==null?'--':liqScore.toFixed(1);
    m('m_trend').textContent  = emaTag;
    m('m_vix').textContent    = vix==null?'--':vix.toFixed(2);

    const clsPCR = (p)=> p==null ? 'text-gray-700' : (p>PCR_BULL?'text-emerald-700':(p<PCR_BEAR?'text-rose-700':'text-amber-700'));
    m('m_pcr10').className = `font-semibold ${clsPCR(pcrW)}`;
    m('m_pcr30').className = `font-semibold ${clsPCR(pcr30)}`;
  }

  maybeEnter(sig, spot, currentPCR){
    if (this.position || !sig.confirmed || (sig.side!=='BULL' && sig.side!=='BEAR')) return;
    if (sig.side !== this.lastBias && Date.now() - this.lastFlipMs < MIN_COOLDOWN_MS) return;

    this.position = { side: sig.side, entryIdx: this.labels.length-1, entryPCR: currentPCR ?? null, entrySpot: spot ?? null };
    this.markersEntry.push({ i:this.position.entryIdx, side:sig.side, pcr: currentPCR ?? null });

    globalJournal.push({ type:'entry', index:this.label, time:new Date().toLocaleString('en-GB',{timeZone:'Asia/Kolkata'}), side:sig.side, spot:(spot??'').toFixed?.call(spot,2)??spot });
    if (sig.side !== this.lastBias) this.lastFlipMs = Date.now();
  }

  maybeExit({trendUp, trendDown, spot, maxPainK, rows}) {
    if (!this.position) return;

    const tolWall = Math.max(this.step*WALL_TOL_FRAC, 20);
    const tolMP   = Math.max(this.step*MP_TOL_FRAC,   30);

    let reason = null;

    if (this.position.side === 'BULL') {
      if (trendDown) reason = 'EMA flip down';
      const cw = nearestCallWallAbove(rows, spot);
      if (!reason && cw!=null && (cw - spot) <= tolWall) reason = `Hit Call Wall ${cw}`;
      if (!reason && maxPainK!=null && Math.abs(maxPainK - spot) <= tolMP) reason = `Near Max Pain ${maxPainK}`;
    } else if (this.position.side === 'BEAR') {
      if (trendUp) reason = 'EMA flip up';
      const pw = nearestPutWallBelow(rows, spot);
      if (!reason && pw!=null && (spot - pw) <= tolWall) reason = `Hit Put Wall ${pw}`;
      if (!reason && maxPainK!=null && Math.abs(maxPainK - spot) <= tolMP) reason = `Near Max Pain ${maxPainK}`;
    }

    if (reason) {
      const idx = Math.max(0, this.labels.length - 1);
      const pcrVal = this._pcrPrev ?? null;
      this.markersExit.push({ i:idx, reason, side:this.position.side, pcr:pcrVal });

      globalJournal.push({ type:'exit', index:this.label, time:new Date().toLocaleString('en-GB',{timeZone:'Asia/Kolkata'}), side:this.position.side, spot:(spot??'').toFixed?.call(spot,2)??spot, reason });
      this.position = null;
      this.rebuildDatasets();
    }
  }

  renderSignal(sig, spot){
    const nowMs = Date.now();
    let displaySide = sig.side;
    if (displaySide !== 'NEUTRAL' && displaySide !== this.lastBias) {
      if (nowMs - this.lastFlipMs < MIN_COOLDOWN_MS) {
        displaySide = this.lastBias;
      }
    }

    const pill=this.el('sigPill');
    const txt=this.el('sigText');
    let cls='bg-gray-100 text-gray-800', label='Signal: Neutral';
    if (displaySide==='BULL'){ label=`Signal: BULL ${sig.confirmed?'• Actionable':'• Hold'}`; cls = sig.confirmed?'bg-emerald-200 text-emerald-900':'bg-emerald-100 text-emerald-800'; }
    if (displaySide==='BEAR'){ label=`Signal: BEAR ${sig.confirmed?'• Actionable':'• Hold'}`; cls = sig.confirmed?'bg-rose-200 text-rose-900':'bg-rose-100 text-rose-800'; }
    pill.textContent = label; pill.className = `pill ${cls}`;

    const parts = [...sig.reasons];
    if (sig.missing.length){ parts.push('Wait: '+sig.missing.join(', ')); }
    if (displaySide!=='NEUTRAL' && sig.confirmed){
      parts.push('Playbook: enter on micro-pullback; stop=EMA flip/opposite bias; partial @ wall/MP; exit on momentum fade.');
    }
    txt.textContent = parts.join('  •  ');

    this.lastBias = displaySide;
    this.biasStreak = sig.biasStreak;
  }

  async fetchOnce(){
    const t0 = performance.now();
    try{
      const res = await fetch(this.buildUrl(), { headers:{ Authorization: AUTH_TOKEN }});
      const json = await res.json();
      if (json.s!=='ok'){ this.el('status').textContent = `API error: ${json.message||json.s}`; return; }

      const data = json.data || {}

      if (!this.currentExpiry && Array.isArray(data.expiryData) && data.expiryData.length){
        const now = Math.floor(Date.now()/1000);
        const future = data.expiryData.map(e=>Number(e.expiry)).filter(ts=>ts>=now).sort((a,b)=>a-b);
        this.currentExpiry = future[0] || Number(data.expiryData[0].expiry);
      }

      const chain = data.optionsChain || [];
      const spotRow = chain.find(r => !r.option_type && r.strike_price===-1);
      const spot = spotRow?.ltp ?? null;
      const rows = chain.filter(r => r.option_type==='CE' || r.option_type==='PE');
      if (!rows?.length || spot==null){ this.el('status').textContent='No rows/spot'; return; }

      const strikes = uniqSortedStrikes(rows);
      const atmNearest = nearestATM(strikes, spot);
      const stepRounded = Math.round(spot / this.step) * this.step;
      const atm = strikes.includes(stepRounded) ? stepRounded : atmNearest;

      const ksWin = chooseWindow(strikes, atm);
      this.selectedKs = ksWin;

      const byKS = new Map();
      for (const r of rows) byKS.set(`${r.option_type}-${r.strike_price}`, r);

      const ceRowsWin = ksWin.map(k=>byKS.get(`CE-${k}`)||{});
      const peRowsWin = ksWin.map(k=>byKS.get(`PE-${k}`)||{});
      const ceAll = rows.filter(x=>x.option_type==='CE');
      const peAll = rows.filter(x=>x.option_type==='PE');

      const ceOIw = sum(ceRowsWin.map(r=>r?.oi));
      const peOIw = sum(peRowsWin.map(r=>r?.oi));
      const pcrW  = ceOIw ? peOIw/ceOIw : null;
      const pcr30 = (sum(peAll.map(r=>r.oi))) / (sum(ceAll.map(r=>r.oi)) || NaN);

      if (pcrW != null){
        const k = 2 / (3 + 1);
        this._pcrPrev = (this._pcrPrev == null) ? pcrW : (pcrW * k + this._pcrPrev * (1 - k));
      }

      const nearIdx = strikes.indexOf(atm);
      const win = strikes.slice(Math.max(0, nearIdx-1), Math.min(strikes.length, nearIdx+2));
      const nearRows = win.flatMap(k=> [byKS.get(`CE-${k}`), byKS.get(`PE-${k}`)] ).filter(Boolean);
      const nearBuildL = OI_TO_LAKHS(sum(nearRows.map(r=>r.oi)));
      const nearOICHPE = sum(nearRows.filter(r=>r.option_type==='PE').map(r=>r.oich||0));
      const nearOICHCE = sum(nearRows.filter(r=>r.option_type==='CE').map(r=>r.oich||0));
      const nearImbPct = (nearOICHPE+nearOICHCE) ? ((nearOICHPE - nearOICHCE) / Math.abs(nearOICHPE+nearOICHCE)) * 100 : 0;

      const maxPainK = maxPain(strikes, rows);

      const ceATM = byKS.get(`CE-${atm}`), peATM = byKS.get(`PE-${atm}`);
      const sCE = pctSpread(ceATM?.bid, ceATM?.ask), sPE = pctSpread(peATM?.bid, peATM?.ask);
      const spread = [sCE,sPE].filter(v=>v!=null);
      const avgSpread = spread.length? spread.reduce((a,b)=>a+b,0)/spread.length : null;
      const volNear = sum(nearRows.map(r=>r.volume||0));
      const liqScore = (avgSpread==null) ? null : Math.max(0, 10 - avgSpread) + Math.min(10, VOL_TO_LAKHS(volNear)/5);

      const vix = data?.indiavixData?.ltp ?? null;

      const t = fmtTime();
      const addNew = (this.labels.length===0 || this.labels[this.labels.length-1]!==t);
      if (addNew) { this.labels.push(t); this.spotSeries.push(spot); } else { this.labels[this.labels.length-1]=t; this.spotSeries[this.spotSeries.length-1]=spot; }

      const addOrUpd = (ref, vals) => { if (addNew){ ref.push(vals); } else { ref[ref.length-1]=vals; } };
      for (const k of ksWin){
        if (!this.series.CE[`K${k}`]) this.series.CE[`K${k}`] = {LTP:[],OI:[],OICH:[],VOL:[]};
        if (!this.series.PE[`K${k}`]) this.series.PE[`K${k}`] = {LTP:[],OI:[],OICH:[],VOL:[]};
        const ce = byKS.get(`CE-${k}`)||{}, pe = byKS.get(`PE-${k}`)||{};
        const CEref = this.series.CE[`K${k}`], PEref = this.series.PE[`K${k}`];

        const valsCE = { LTP:Number(ce.ltp??null), OI:ce.oi==null?null:OI_TO_LAKHS(ce.oi), OICH:ce.oich==null?null:OI_TO_LAKHS(ce.oich), VOL:ce.volume==null?null:VOL_TO_LAKHS(ce.volume) };
        const valsPE = { LTP:Number(pe.ltp??null), OI:pe.oi==null?null:OI_TO_LAKHS(pe.oi), OICH:pe.oich==null?null:OI_TO_LAKHS(pe.oich), VOL:pe.volume==null?null:VOL_TO_LAKHS(pe.volume) };

        const keyPCR = `K${k}`;
        if (!this.seriesPCR[keyPCR]) this.seriesPCR[keyPCR] = { PCR: [] };
        const PCRref = this.seriesPCR[keyPCR].PCR;

        const ceOIraw = Number(ce.oi ?? NaN);
        const peOIraw = Number(pe.oi ?? NaN);
        const pcrVal  = (isFinite(ceOIraw) && ceOIraw > 0 && isFinite(peOIraw)) ? (peOIraw / ceOIraw) : null;

        addOrUpd(CEref.LTP, valsCE.LTP); addOrUpd(CEref.OI, valsCE.OI); addOrUpd(CEref.OICH, valsCE.OICH); addOrUpd(CEref.VOL, valsCE.VOL);
        addOrUpd(PEref.LTP, valsPE.LTP); addOrUpd(PEref.OI, valsPE.OI); addOrUpd(PEref.OICH, valsPE.OICH); addOrUpd(PEref.VOL, valsPE.VOL);
        addOrUpd(PCRref, pcrVal);
      }

      // ====== CVD (window) ======
      const sumOICH_CE_L = OI_TO_LAKHS(sum(ceRowsWin.map(r=>r?.oich||0)));
      const sumOICH_PE_L = OI_TO_LAKHS(sum(peRowsWin.map(r=>r?.oich||0)));
      if (addNew) {
        const lastCE = this.cvdCE.length ? this.cvdCE[this.cvdCE.length-1] : 0;
        const lastPE = this.cvdPE.length ? this.cvdPE[this.cvdPE.length-1] : 0;
        this.cvdCE.push(lastCE + sumOICH_CE_L);
        this.cvdPE.push(lastPE + sumOICH_PE_L);
      } else {
        const baseCE = (this.cvdCE.length>1 ? this.cvdCE[this.cvdCE.length-2] : 0);
        const basePE = (this.cvdPE.length>1 ? this.cvdPE[this.cvdPE.length-2] : 0);
        this.cvdCE[this.cvdCE.length-1] = baseCE + sumOICH_CE_L;
        this.cvdPE[this.cvdPE.length-1] = basePE + sumOICH_PE_L;
      }

      // ====== CLTP (window): TRUE cumulative ΔLTP across strikes ======
      const sumLTP_CE = sum(ceRowsWin.map(r => Number(r.ltp || 0)));
      const sumLTP_PE = sum(peRowsWin.map(r => Number(r.ltp || 0)));
      const dCE = (this._prevSumLTP_CE==null) ? 0 : (sumLTP_CE - this._prevSumLTP_CE);
      const dPE = (this._prevSumLTP_PE==null) ? 0 : (sumLTP_PE - this._prevSumLTP_PE);
      this._prevSumLTP_CE = sumLTP_CE; this._prevSumLTP_PE = sumLTP_PE;
      if (addNew) {
        const lastCE = this.cltpCE.length ? this.cltpCE[this.cltpCE.length-1] : 0;
        const lastPE = this.cltpPE.length ? this.cltpPE[this.cltpPE.length-1] : 0;
        this.cltpCE.push(lastCE + dCE);
        this.cltpPE.push(lastPE + dPE);
      } else {
        const baseCE = (this.cltpCE.length>1 ? this.cltpCE[this.cltpCE.length-2] : 0);
        const basePE = (this.cltpPE.length>1 ? this.cltpPE[this.cltpPE.length-2] : 0);
        this.cltpCE[this.cltpCE.length-1] = baseCE + dCE;
        this.cltpPE[this.cltpPE.length-1] = basePE + dPE;
      }

      // ====== NEW: ATM Premium & Volume Divergence ======
      const atmCE = byKS.get(`CE-${atm}`) || {};
      const atmPE = byKS.get(`PE-${atm}`) || {};
      const dVolCE = (this._prevVolCE==null) ? 0 : Math.max(0, (atmCE.volume||0) - this._prevVolCE);
      const dVolPE = (this._prevVolPE==null) ? 0 : Math.max(0, (atmPE.volume||0) - this._prevVolPE);
      this._prevVolCE = (atmCE.volume||0);
      this._prevVolPE = (atmPE.volume||0);

      const volDivNow = VOL_TO_LAKHS(dVolCE - dVolPE); // CE−PE flow this tick
      if (addNew){
        this.atmCePrem.push(Number(atmCE.ltp||null));
        this.atmPePrem.push(Number(atmPE.ltp||null));
        this.volDiv.push(volDivNow);
      } else {
        this.atmCePrem[this.atmCePrem.length-1] = Number(atmCE.ltp||null);
        this.atmPePrem[this.atmPePrem.length-1] = Number(atmPE.ltp||null);
        this.volDiv[this.volDiv.length-1] = volDivNow;
      }

      // ====== Trim ======
      const trim=(arr)=>{ if (arr.length>380) arr.splice(0, arr.length-380); };
      if (this.labels.length>380) this.labels.splice(0, this.labels.length-380);
      [this.spotSeries,this.cvdCE,this.cvdPE,this.cltpCE,this.cltpPE,this.atmCePrem,this.atmPePrem,this.volDiv].forEach(trim);
      for (const side of ['CE','PE']) for (const key of Object.keys(this.series[side]))
        ['LTP','OI','OICH','VOL'].forEach(k=>trim(this.series[side][key][k]));
      for (const key of Object.keys(this.seriesPCR)) trim(this.seriesPCR[key].PCR);

      if (this.firstPaint || this.pcrChart.data.datasets.length === 0){ this.rebuildDatasets(); this.firstPaint=false; }
      else [this.pcrChart,this.oichChart,this.cvdChart,this.divChart].forEach(c=>c.update('none'));

      const emaTag = (()=>{ const s3=ema(this.spotSeries,3), s8=ema(this.spotSeries,8); if(s3.at(-1)!=null && s8.at(-1)!=null) return s3.at(-1)>s8.at(-1)?'UP':(s3.at(-1)<s8.at(-1)?'DOWN':'FLAT'); return '--'; })();
      this.renderKeyBar({ spot, atm, pcrW:(this._pcrPrev ?? pcrW), pcr30:isFinite(pcr30)?pcr30:null, maxPainK, vix, nearBuildL, nearImbPct, liqScore, emaTag });
      this.renderWalls(spot, rows);

      const sig = signalFrom({
        spotSeries:this.spotSeries, spot, atm, vix,
        ceATM: byKS.get(`CE-${atm}`), peATM: byKS.get(`PE-${atm}`),
        ceRowsWin, peRowsWin,
        lastBias:this.lastBias, biasStreak:this.biasStreak,
        _pcrOverride: this._pcrPrev
      });

      this.renderSignal(sig, spot);
      this.maybeEnter(sig, spot, (this._pcrPrev ?? pcrW));
      this.maybeExit({trendUp:sig.trendUp, trendDown:sig.trendDown, spot, maxPainK, rows});

      this.el('status').textContent = `Updated ${fmtTime()} • ATM ${atm} • ${(performance.now()-t0|0)} ms`;

    } catch (e){
      this.el('status').textContent = 'Fetch error (console)';
      console.error(this.label, e);
    }
  }
}

const panels = [
  new IndexPanel("NSE:NIFTY50-INDEX",   INDEX_META["NSE:NIFTY50-INDEX"].step,   INDEX_META["NSE:NIFTY50-INDEX"].label),
];

let tickTimer=null;
async function tickAll(){
  const t0 = performance.now();
  await Promise.all(panels.map(p => p.fetchOnce()));
  document.getElementById('globalStatus').textContent = `Synced ${fmtTime()} • ${(performance.now()-t0|0)} ms`;
}
function start(){ if(tickTimer) clearInterval(tickTimer); tickTimer=setInterval(tickAll, REFRESH_MS); tickAll(); }
start();

/* =========================
   JOURNAL EXPORT
   ========================= */
const globalJournal = [];
document.getElementById('btnCSV').onclick = ()=>{
  if (!globalJournal.length) return;
  const cols=['type','index','time','side','spot','reason'];
  const rows = globalJournal.map(r => cols.map(c=>r[c]??'').join(','));
  const csv = cols.join(',')+'\n'+rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='signals_journal_all_indices.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
};

/* =========================
   FULLSCREEN
   ========================= */
const fsBtn=document.getElementById('fsBtn');
function inFS(){ return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement); }
function reqFS(el){ (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || Function.prototype).call(el); }
function exitFS(){ (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen || Function.prototype).call(document); }
fsBtn.onclick = ()=> inFS()? exitFS(): reqFS(document.documentElement);
document.addEventListener('fullscreenchange', ()=> fsBtn.textContent = inFS()? 'Exit Fullscreen' : '⛶ Fullscreen');
</script>
</body>
</html>
